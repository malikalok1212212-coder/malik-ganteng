<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Motion Studio – Editor Animasi SVG</title>
<style>
:root{--bg:#f1eeff;--pn:#fff;--ink:#14121f;--mu:#5d5a70;--bd:#d8d0fb;--ac:#6240e0;--fl:#e8e3ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0e13;--pn:#17171f;--ink:#faf9f5;--mu:#a9a6c4;--bd:#3a3950;--ac:#7c5cff;--fl:#20202b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e0e13;--pn:#17171f;--ink:#faf9f5;--mu:#a9a6c4;--bd:#3a3950;--ac:#7c5cff;--fl:#20202b;color-scheme:dark}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font:13px/1.4 system-ui,-apple-system,Segoe UI,sans-serif}
header{display:flex;gap:6px;align-items:center;padding:8px 10px;background:var(--pn);border-bottom:1px solid var(--bd);flex-wrap:wrap}
header b{margin-right:auto;font-size:15px}
header input[type=number]{width:60px}
#st{flex:1;min-height:120px;display:flex;touch-action:none;padding:8px}
#st svg{width:100%;height:100%}
#pn{background:var(--pn);border-top:1px solid var(--bd);max-height:50%;overflow:auto;padding:8px 10px 12px;display:flex;flex-direction:column;gap:8px}
.bar{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
button,select,input[type=number]{font:inherit;color:var(--ink);background:var(--fl);border:1px solid var(--bd);border-radius:8px;padding:6px 10px;min-height:34px}
input[type=color]{width:40px;height:34px;padding:2px;border:1px solid var(--bd);border-radius:8px;background:var(--fl)}
button.p{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:700}
.ch.on{border-color:var(--ac);color:var(--ac);font-weight:700}
#tm{flex:1;accent-color:var(--ac)}
.rw{display:grid;grid-template-columns:78px 1fr 44px 34px;gap:6px;align-items:center}
.rw input{width:100%;accent-color:var(--ac)}.rw output{font-variant-numeric:tabular-nums;color:var(--mu)}
.kd{padding:0;color:var(--mu)}.kd.has{color:var(--ac)}.kd.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.tl{position:relative;display:flex;flex-direction:column;gap:3px}
.tr{display:flex;align-items:center;height:22px}.tr span{width:64px;color:var(--mu);font-size:11px}
.lane{flex:1;margin:0 8px;height:4px;background:var(--fl);border-radius:2px;position:relative}
.dm{position:absolute;top:50%;width:13px;height:13px;background:var(--mu);transform:translate(-50%,-50%) rotate(45deg);border-radius:2px}
.dm:after{content:"";position:absolute;inset:-9px}.dm.on{background:var(--ac)}
.ph{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--ac);pointer-events:none}
small{color:var(--mu)}
dialog{background:var(--pn);color:var(--ink);border:1px solid var(--bd);border-radius:12px;width:min(92vw,560px)}
textarea{width:100%;height:40vh;font:11px monospace;background:var(--fl);color:var(--ink);border:1px solid var(--bd);border-radius:8px;margin-bottom:8px}
</style></head><body>
<header><a href="/#svg-motion" style="color:var(--mu);text-decoration:none;font-size:18px;padding:0 4px" aria-label="Kembali ke Malik Tools">←</a><b>◆ Motion Studio</b>
<select id="ar"><option value="360x640">9:16</option><option value="360x360">1:1</option><option value="640x360">16:9</option></select>
<input type="color" id="bg" value="#14171f" title="Latar">
<input type="number" id="du" value="3" min="0.5" max="30" step="0.5" title="Durasi (detik)">
<button id="ex" class="p">Ekspor SVG</button></header>
<main id="st"></main>
<section id="pn">
<div class="bar"><button id="pl" class="p">▶</button><input id="tm" type="range" min="0" max="3" step="0.01" value="0"><output id="to">0.00s</output></div>
<div class="bar"><button data-a="kotak">▭</button><button data-a="bulat">◯</button><button data-a="segitiga">△</button><button data-a="bintang">★</button><button data-a="teks">T</button><button data-a="foto">🖼 Foto</button><small>Preset:</small><button data-pr="Fade">Fade</button><button data-pr="Pop">Pop</button><button data-pr="Slide">Slide</button><button data-pr="Putar">Putar</button></div>
<input type="file" id="fi" accept="image/*" multiple hidden><div id="ly" class="bar"></div><div id="pr"></div><div id="tk"></div><div id="kb"></div>
</section>
<dialog id="dg"><textarea id="cd" readonly></textarea><div class="bar"><button id="cp" class="p">Salin</button><button id="dn">Unduh .svg</button><button id="dx">Ke Alight XML</button><button id="cl">Tutup</button></div></dialog>
<script>
const $=s=>document.querySelector(s);
let W=360,H=640,D=3,T=0,play=0,sel=null,sk=null,uid=1,L=[],last=0,dr=null;
const PS=['x','y','s','r','o'],NM={x:'Posisi X',y:'Posisi Y',s:'Skala',r:'Rotasi',o:'Opacity'};
const RG={x:[-400,800,1],y:[-400,900,1],s:[0,5,.01],r:[-720,720,1],o:[0,1,.01]};
const EA={linear:[0,0,1,1],easeIn:[.42,0,1,1],easeOut:[0,0,.58,1],easeInOut:[.42,0,.58,1],tahan:[1,0,1,0]};
const COL=['#ff4d81','#3d9bff','#ffc83d','#35d07f','#a46bff'];
function bz(e,x){const[a,b,c,d]=e;let lo=0,hi=1,u=x;for(let i=0;i<26;i++){u=(lo+hi)/2;const m=1-u;(3*m*m*u*a+3*m*u*u*c+u*u*u)<x?lo=u:hi=u}const m=1-u;return 3*m*m*u*b+3*m*u*u*d+u*u*u}
function val(l,p,t){const k=l.kf[p];if(!k||!k.length)return l.b[p];if(t<=k[0].t)return k[0].v;const n=k.length-1;if(t>=k[n].t)return k[n].v;let i=0;while(k[i+1].t<=t)i++;const a=k[i],b=k[i+1];return a.v+(b.v-a.v)*bz(EA[a.e],(t-a.t)/(b.t-a.t))}
function mk(ty){const n=uid++,l={id:n,ty,n:ty+' '+n,f:COL[n%5],tx:'Halo',b:{x:W/2,y:H/2,s:1,r:0,o:1},kf:{}};L.push(l);sel=l;sk=null;return l}
function shp(l){if(l.ty=='foto')return `<image href="${l.img}" x="${-l.w/2}" y="${-l.h/2}" width="${l.w}" height="${l.h}"/>`;const f=`fill="${l.f}"`;
 if(l.ty=='kotak')return `<rect x="-60" y="-60" width="120" height="120" rx="14" ${f}/>`;
 if(l.ty=='bulat')return `<circle r="60" ${f}/>`;
 if(l.ty=='segitiga')return `<path d="M0 -66L62 44H-62Z" ${f}/>`;
 if(l.ty=='bintang'){let p='';for(let i=0;i<10;i++){const a=i*Math.PI/5-Math.PI/2,r=i%2?30:68;p+=(r*Math.cos(a)).toFixed(1)+','+(r*Math.sin(a)).toFixed(1)+' '}return `<polygon points="${p}" ${f}/>`}
 return `<text text-anchor="middle" dominant-baseline="central" font-size="56" font-weight="800" font-family="Arial,sans-serif" ${f}>${l.tx.replace(/[<>&]/g,'')}</text>`}
let sig='';
function draw(){
 const sg=[W,H,$('#bg').value,sel&&sel.id,L.map(l=>l.id+l.f+l.tx).join()].join('|');
 if(sg==sig){for(const l of L){const g=$('#st g[data-l="'+l.id+'"]'),v=p=>val(l,p,T);if(g){g.setAttribute('opacity',v('o'));g.setAttribute('transform',`translate(${v('x')} ${v('y')}) rotate(${v('r')}) scale(${v('s')})`)}}return}
 sig=sg;
 let s=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg"><rect width="${W}" height="${H}" fill="${$('#bg').value}"/>`;
 for(const l of L){const v=p=>val(l,p,T);s+=`<g data-l="${l.id}" ${l==sel?'data-s="1"':''} opacity="${v('o')}" transform="translate(${v('x')} ${v('y')}) rotate(${v('r')}) scale(${v('s')})">${shp(l)}</g>`}
 $('#st').innerHTML=s+'</svg>';
 const g=$('#st g[data-s]');if(g){const b=g.getBBox();g.insertAdjacentHTML('beforeend',`<rect x="${b.x}" y="${b.y}" width="${b.width}" height="${b.height}" fill="none" stroke="#3d9bff" stroke-width="1.5" stroke-dasharray="5 4" vector-effect="non-scaling-stroke" pointer-events="none"/>`)}}
function ui(){
 $('#tm').max=D;$('#tm').value=T;$('#to').textContent=T.toFixed(2)+'s';
 $('#ly').innerHTML=L.map(l=>`<button class="ch ${l==sel?'on':''}" data-l="${l.id}">${l.n}</button>`).join('')||'<small>Tambah bentuk dulu</small>';
 if(!sel){$('#pr').innerHTML=$('#tk').innerHTML=$('#kb').innerHTML='';return}
 $('#pr').innerHTML=PS.map(p=>{const v=val(sel,p,T),k=sel.kf[p]||[],on=k.some(q=>Math.abs(q.t-T)<.015);return `<div class="rw"><span>${NM[p]}</span><input type="range" data-p="${p}" min="${RG[p][0]}" max="${RG[p][1]}" step="${RG[p][2]}" value="${v}"><output>${+v.toFixed(2)}</output><button class="kd ${on?'on':k.length?'has':''}" data-k="${p}">◆</button></div>`}).join('')+`<div class="bar"><input type="color" id="fc" value="${sel.f}">${sel.ty=='teks'?'<button id="et">Ubah teks</button>':''}<button id="up">▲</button><button id="dw">▼</button><button id="dp">Gandakan</button><button id="rm">Hapus</button></div>`;
 $('#tk').innerHTML=`<div class="tl">`+PS.map(p=>`<div class="tr"><span>${NM[p]}</span><div class="lane">`+(sel.kf[p]||[]).map((q,i)=>`<i class="dm ${sk&&sk[0]==p&&sk[1]==i?'on':''}" data-d="${p},${i}" style="left:${q.t/D*100}%"></i>`).join('')+`</div></div>`).join('')+`<b class="ph" style="left:calc(72px + (100% - 80px) * ${T/D})"></b></div>`;
 const q=sk&&sel.kf[sk[0]]&&sel.kf[sk[0]][sk[1]];
 $('#kb').innerHTML=q?`<div class="bar"><small>Keyframe ${NM[sk[0]]} @${q.t}s</small><select id="es">${Object.keys(EA).map(e=>`<option ${e==q.e?'selected':''}>${e}</option>`).join('')}</select><button id="dk">Hapus keyframe</button></div>`:''}
function setVal(l,p,v){const k=l.kf[p];if(k&&k.length){const q=k.find(q=>Math.abs(q.t-T)<.015);if(q)q.v=v;else{k.push({t:+T.toFixed(2),v,e:'easeInOut'});k.sort((a,b)=>a.t-b.t)}}else l.b[p]=v}
function tog(p){const k=sel.kf[p]=sel.kf[p]||[],i=k.findIndex(q=>Math.abs(q.t-T)<.015);if(i>=0){sel.b[p]=k[i].v;k.splice(i,1)}else{const v=val(sel,p,T);k.push({t:+T.toFixed(2),v,e:'easeInOut'});k.sort((a,b)=>a.t-b.t)}sk=null}
const kf=(l,p,t,v,e='easeInOut')=>{(l.kf[p]=l.kf[p]||[]).push({t:+Math.min(t,D).toFixed(2),v,e});l.kf[p].sort((a,b)=>a.t-b.t)};
const PR={Fade:l=>{l.kf.o=[];kf(l,'o',T,0);kf(l,'o',T+.6,1)},Pop:l=>{l.kf.s=[];kf(l,'s',T,0,'easeOut');kf(l,'s',T+.4,1.25);kf(l,'s',T+.7,1)},Slide:l=>{l.kf.x=[];l.kf.o=[];kf(l,'x',T,l.b.x-220,'easeOut');kf(l,'x',T+.7,l.b.x);kf(l,'o',T,0);kf(l,'o',T+.4,1)},Putar:l=>{l.kf.r=[];kf(l,'r',T,0);kf(l,'r',T+1.5,360)}};
/* ekspor: SMIL, tiap properti = grup bersarang sendiri supaya easing akurat */
function at(l,p,f,ty){const k=l.kf[p];if(!k||k.length<2)return '';const ks=k.map(q=>({...q}));
 if(ks[0].t>0)ks.unshift({t:0,v:ks[0].v,e:'linear'});
 if(ks[ks.length-1].t<D)ks.push({t:D,v:ks[ks.length-1].v,e:'linear'});
 const kt=ks.map(q=>+(q.t/D).toFixed(4)).join(';'),vs=ks.map(q=>f(q.v)).join(';'),sp=ks.slice(0,-1).map(q=>EA[q.e].join(' ')).join(';');
 return `<${ty?`animateTransform attributeName="transform" type="${ty}"`:`animate attributeName="opacity"`} dur="${D}s" repeatCount="indefinite" calcMode="spline" keyTimes="${kt}" values="${vs}" keySplines="${sp}"/>`}
function exp(){let s=`<?xml version="1.0" encoding="UTF-8"?>\n<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">\n<rect width="${W}" height="${H}" fill="${$('#bg').value}"/>\n`;
 for(const l of L){const v=p=>val(l,p,0);
  s+=`<g opacity="${v('o')}">${at(l,'o',v=>v,'')}<g transform="translate(${v('x')} 0)">${at(l,'x',v=>v+' 0','translate')}<g transform="translate(0 ${v('y')})">${at(l,'y',v=>'0 '+v,'translate')}<g transform="rotate(${v('r')})">${at(l,'r',v=>v,'rotate')}<g transform="scale(${v('s')})">${at(l,'s',v=>v,'scale')}${shp(l)}</g></g></g></g></g>\n`}
 return s+'</svg>'}
function loop(ts){if(!play)return;T+=(ts-last)/1000;last=ts;if(T>=D)T%=D;draw();$('#tm').value=T;$('#to').textContent=T.toFixed(2)+'s';requestAnimationFrame(loop)}
$('#pl').onclick=()=>{play=!play;$('#pl').textContent=play?'❚❚':'▶';if(play){last=performance.now();requestAnimationFrame(loop)}else{ui();draw()}};
$('#pn').onclick=e=>{const b=e.target.closest('button,i');if(!b)return;const d=b.dataset;
 if(d.l)sel=L.find(l=>l.id==d.l),sk=null;
 else if(d.a=='foto'){$('#fi').click();return}
 else if(d.a)mk(d.a);
 else if(d.pr&&sel)PR[d.pr](sel);
 else if(d.k)tog(d.k);
 else if(d.d){const[p,i]=d.d.split(',');sk=[p,+i];T=sel.kf[p][+i].t}
 else if(b.id=='et'){const t=prompt('Teks:',sel.tx);if(t)sel.tx=t}
 else if(b.id=='dp'){const c=JSON.parse(JSON.stringify(sel));c.id=uid++;c.n=c.ty+' '+c.id;c.b.x+=30;c.b.y+=30;L.push(c);sel=c}
 else if(b.id=='up'||b.id=='dw'){const i=L.indexOf(sel),j=i+(b.id=='up'?1:-1);if(j>=0&&j<L.length)[L[i],L[j]]=[L[j],L[i]]}
 else if(b.id=='rm'){L=L.filter(l=>l!=sel);sel=L[L.length-1]||null;sk=null}
 else if(b.id=='dk'){const k=sel.kf[sk[0]];sel.b[sk[0]]=k[sk[1]].v;k.splice(sk[1],1);sk=null}
 else return;ui();draw()};
$('#pn').oninput=e=>{const t=e.target,d=t.dataset;
 if(t.id=='tm'){T=+t.value;ui();draw()}
 else if(d.p){setVal(sel,d.p,+t.value);t.nextElementSibling.textContent=+(+t.value).toFixed(2);draw()}
 else if(t.id=='fc'){sel.f=t.value;draw()}
 else if(t.id=='es'){sel.kf[sk[0]][sk[1]].e=t.value}};
$('#pn').onchange=e=>{if(e.target.dataset.p){ui();draw()}};
$('#du').onchange=e=>{D=Math.max(.5,Math.min(30,+e.target.value||3));L.forEach(l=>PS.forEach(p=>(l.kf[p]||[]).forEach(q=>q.t=Math.min(q.t,D))));T=Math.min(T,D);ui();draw()};
$('#ar').onchange=e=>{[W,H]=e.target.value.split('x').map(Number);draw()};
$('#bg').oninput=draw;
const st=$('#st');
st.onpointerdown=e=>{const g=e.target.closest('g[data-l]');if(!g)return;sel=L.find(l=>l.id==g.dataset.l);dr={x:e.clientX,y:e.clientY,bx:val(sel,'x',T),by:val(sel,'y',T)};st.setPointerCapture(e.pointerId);ui();draw()};
st.onpointermove=e=>{if(!dr)return;const r=st.querySelector('svg').getBoundingClientRect(),k=Math.min(r.width/W,r.height/H);setVal(sel,'x',Math.round(dr.bx+(e.clientX-dr.x)/k));setVal(sel,'y',Math.round(dr.by+(e.clientY-dr.y)/k));draw()};
st.onpointerup=()=>{if(dr){dr=null;ui()}};
$('#ex').onclick=()=>{$('#cd').value=exp();$('#dg').showModal()};
$('#cl').onclick=()=>$('#dg').close();
$('#cp').onclick=async()=>{try{await navigator.clipboard.writeText($('#cd').value)}catch(_){$('#cd').select();document.execCommand('copy')}$('#cp').textContent='Tersalin ✓';setTimeout(()=>$('#cp').textContent='Salin',1500)};
const dl=x=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([$('#cd').value],{type:x=='xml'?'application/xml':'image/svg+xml'}));a.download='animasi.'+x;a.click()};$('#dn').onclick=()=>dl('svg');$('#dx').onclick=()=>{try{sessionStorage.setItem('mt-svg',$('#cd').value)}catch(e){}location.href='/#svg-xml'};
$('#fi').onchange=async e=>{for(const f of e.target.files){const im=new Image(),u=URL.createObjectURL(f);await new Promise(r=>{im.onload=r;im.onerror=r;im.src=u});if(!im.width)continue;const k=Math.min(1,800/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);const mt=/png|webp|gif/.test(f.type)?'image/png':'image/jpeg',l=mk('foto'),sc=Math.min(W*.8/c.width,H*.8/c.height);l.img=c.toDataURL(mt,.85);l.w=Math.round(c.width*sc);l.h=Math.round(c.height*sc);URL.revokeObjectURL(u)}e.target.value='';ui();draw()};
/* demo awal */
mk('bintang');sel.b.y=250;PR.Pop(sel);PR.Putar(sel);
mk('teks');sel.b.y=420;PR.Slide(sel);sel=L[0];
T=0;ui();draw();
</script></body></html>
