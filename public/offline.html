<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sedang offline | Malik Tools</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0d0d0e">
<link rel="icon" href="/favicon.ico" sizes="any">
<style>
:root{color-scheme:dark light;--bg:#0a0d0c;--ink:#f2f6f4;--mut:#9aa8a1;--ac:#4fd69a}
@media(prefers-color-scheme:light){:root{--bg:#f6f8f7;--ink:#101513;--mut:#55635c;--ac:#0f9d58}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:380px;text-align:center}
svg{width:56px;height:56px;stroke:var(--ac);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
h1{font-size:22px;margin:14px 0 6px}
p{margin:0 0 18px;color:var(--mut)}
.b{display:inline-block;margin:4px;padding:11px 20px;border-radius:12px;border:1px solid var(--ac);background:var(--ac);color:#06110b;font:600 15px system-ui,sans-serif;text-decoration:none;cursor:pointer}
.b.o{background:transparent;color:var(--ac)}
</style>
</head>
<body>
<main>
<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 8.8a15 15 0 0120 0M5 12.2a10 10 0 0114 0M8.5 15.5a5 5 0 017 0"/><path d="M12 19h.01"/><path d="M3 3l18 18"/></svg>
<h1>Sedang offline</h1>
<p>Halaman ini belum tersimpan di perangkat. Sambungkan internet lalu coba lagi. Beranda dan tool yang pernah kamu buka tetap bisa dipakai.</p>
<button class="b" type="button" onclick="location.reload()">Coba lagi</button>
<a class="b o" href="/">Ke beranda</a>
</main>
<script>addEventListener('online',function(){location.reload()})</script>
</body>
</html>
