.ban-logo{position:absolute;right:5%;top:50%;transform:translateY(-50%);width:44%;text-align:center}
.ban-logo b{display:block;font:800 italic clamp(32px,11vw,58px)/1 Montserrat,"Space Grotesk",system-ui,sans-serif;letter-spacing:-.035em}
.rl{display:flex;align-items:center;gap:6px;color:var(--tc)}
.rl i{flex:1;height:2px;background:currentColor;opacity:.85}
.rl svg{width:clamp(20px,6vw,30px);flex:none}
.rl:first-child{margin-bottom:6px}
.rl.s{margin-top:6px}
.rl.s span{font:500 italic clamp(11px,3.4vw,16px)/1 Montserrat,"Space Grotesk",system-ui,sans-serif;letter-spacing:.14em}
/* menu samping */
.scrim{position:fixed;left:0;right:0;bottom:0;top:var(--hh,60px);background:rgba(0,0,0,.6);z-index:6;opacity:0;visibility:hidden}
.scrim.on{opacity:1;visibility:visible}
.drw{position:fixed;left:0;bottom:0;top:var(--hh,60px);width:min(86vw,340px);background:var(--bg);border-right:2px solid var(--bd);z-index:7;overflow-y:auto;overscroll-behavior:contain;padding:16px 14px calc(28px + env(safe-area-inset-bottom,0px));transform:translateX(-102%);visibility:hidden}
.drw.on{transform:none;visibility:visible}
.st{display:flex;align-items:center;gap:12px;padding:12px 14px;border:2px solid var(--bd);border-radius:16px;background:var(--panel);box-shadow:3px 3px 0 var(--sh);margin-bottom:12px}
.st i{width:12px;height:12px;border-radius:50%;background:var(--ok);flex:none}
.st b{display:block;font-size:16px;line-height:1.2}
.st span{font-size:13px;color:var(--muted)}
.dl{display:flex;align-items:center;gap:12px;width:100%;padding:7px 8px;border:2px solid transparent;border-radius:14px;color:var(--ink);font:700 16px "Space Grotesk",system-ui,sans-serif;text-decoration:none}
.dl .ic{width:36px;height:36px;border:2px solid var(--bd);border-radius:11px;display:grid;place-items:center;flex:none;background:var(--panel)}
.dl .ic svg.i{width:20px;height:20px}
.dl[aria-current=page]{background:var(--tc);color:#07100b;border-color:var(--bd)}
.dl[aria-current=page] .ic{background:#fff;border-color:#07100b}
.dh{display:flex;justify-content:space-between;align-items:center;margin:16px 2px 8px;font:700 13px "Space Mono",monospace;color:var(--muted)}
.dh button{padding:3px 12px;font:700 12px "Space Mono",monospace;border-width:2px;border-radius:999px;box-shadow:none}
.sr{position:relative;margin:0 0 6px}
.sr input{margin:0;padding:10px 12px 10px 42px;border-width:2px;border-radius:14px}
.sr svg.i{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}
.drw :focus-visible{outline:3px solid var(--tc);outline-offset:2px}
@media (prefers-reduced-motion:no-preference){.drw{transition:transform .22s ease,visibility .22s}.scrim{transition:opacity .22s ease,visibility .22s}}
/* halaman tambahan */
select{width:100%;font:500 16px/1.4 "Space Grotesk",system-ui,sans-serif;color:var(--ink);background:var(--field);border:3px solid var(--bd);border-radius:14px;padding:11px 13px;margin-bottom:14px}

.stg{position:relative;width:100%}
.dc{position:absolute;display:block;border:3px solid var(--bd);background:var(--tc);box-shadow:4px 4px 0 var(--sh);--r:0deg}

.dt:first-child{background:#07100b}
.dt:nth-child(2){background:#f2f7f4}

.rb{margin-left:auto}
.pb{background:var(--field)}
.pb i{display:block;height:100%;width:0;transition:width .35s ease}
.lg{font:500 13px/1.45 "Space Mono",monospace;color:var(--ink)}
.ll{display:grid;grid-template-columns:auto auto 1fr auto;align-items:start}

.ll .bd.ok{border-color:#07100b}

/* polish v156: panel, hero tile, segmen, changelog, role, stats, chat */
.panel{background:linear-gradient(180deg,color-mix(in srgb,var(--panel) 92%,#34d399) 0%,var(--panel) 38%);border-color:color-mix(in srgb,var(--ink) 10%,transparent);box-shadow:none}

.seg button{border-radius:999px;transition:transform .15s,background .15s,border-color .15s}
.seg button:active{transform:scale(.96)}
.seg button[aria-pressed="true"]{box-shadow:none}
.panel input,.panel select,.panel textarea{border-radius:16px;transition:border-color .2s,box-shadow .2s}
.panel input:focus,.panel select:focus,.panel textarea:focus{outline:0;border-color:#34d399;box-shadow:0 0 0 3px rgba(52,211,153,.18)}
.cl{position:relative;margin-bottom:6px;padding:14px 14px 16px;border-radius:18px;border:1px solid color-mix(in srgb,var(--ink) 8%,transparent);background:color-mix(in srgb,var(--field) 70%,transparent)}

.rcard[aria-pressed="true"]{box-shadow:none}
.rcard .rp{letter-spacing:-.03em}
.rk li{border-radius:16px}
.pfp .pst>*{border-radius:18px;transition:transform .15s}
.cb{border-width:1px;border-radius:18px;border-top-left-radius:6px}
.cmsg{padding:2px 0}
.cmsg+.cmsg{margin-top:4px}

/* animasi v158 */
@keyframes mIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes mPop{from{opacity:0;transform:translateY(10px) scale(.94)}60%{transform:translateY(-1px) scale(1.01)}to{opacity:1;transform:none}}
@keyframes mSheen{from{transform:translateX(-120%) skewX(-18deg)}to{transform:translateX(320%) skewX(-18deg)}}
@keyframes mFloat{50%{transform:translateY(-3px)}}
@keyframes mBar{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes mRise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
main>section.panel{animation:mIn .3s ease-out both}
.cl{animation:mRise .5s both}
.cl:nth-of-type(1){animation-delay:.12s}.cl:nth-of-type(2){animation-delay:.2s}.cl:nth-of-type(3){animation-delay:.28s}.cl:nth-of-type(4){animation-delay:.36s}.cl:nth-of-type(n+5){animation-delay:.44s}
.rcard{animation:mPop .55s both}.rcard:nth-child(2){animation-delay:.1s}.rcard:nth-child(3){animation-delay:.2s}.rcard:nth-child(4){animation-delay:.3s}
.rk li{animation:mRise .45s both}.rk li:nth-child(2){animation-delay:.07s}.rk li:nth-child(3){animation-delay:.14s}.rk li:nth-child(4){animation-delay:.21s}.rk li:nth-child(n+5){animation-delay:.28s}
.hero .hst{animation:mPop .55s both}.hero .hst:nth-child(1){animation-delay:.25s}.hero .hst:nth-child(2){animation-delay:.33s}.hero .hst:nth-child(3){animation-delay:.41s}
.hero .hh{animation:mRise .55s .12s both}.hero .htip{animation:mRise .55s .5s both}.hero .hb{animation:mRise .55s .58s both}
.hbp{position:relative;overflow:hidden}
.hbp:after{content:"";position:absolute;top:0;bottom:0;left:0;width:36%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);animation:mSheen 1.1s 1s ease-out 1 both}
.hbp svg{transition:transform .25s}.hbp:hover svg,.hbp:active svg{transform:translateX(4px)}
.nxg{transition:transform .2s,box-shadow .25s,border-color .25s}
.nxg:active{transform:scale(.985)}
.tr,.nxh,.dock a,.seg button,.btn,button.primary{transition:transform .15s,background-color .2s,border-color .2s,box-shadow .2s,color .2s}
.tr:active,.dock a:active,.btn:active,button.primary:active{transform:scale(.96)}
@media (prefers-reduced-motion:reduce){main>section.panel,.panel *,.cl,.rcard,.rk li,.cmsg,.hero *,.hem,.hbp:after,.cnew,.pfp *,.dock a{animation:none!important;transition:none!important}}

   const j=await api('getcontact-start',v,$(r,'#k').value);go.disabled=false;

<script>
/* dropdown kustom: ganti popup bawaan browser dengan bottom sheet */
(function(){
 const CH='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>',CK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
 let scrim,sheet,cur=null,prevFocus=null;
 const build=()=>{if(sheet)return;scrim=document.createElement('div');scrim.className='ddscrim';sheet=document.createElement('div');sheet.className='ddsheet';sheet.setAttribute('role','listbox');document.body.append(scrim,sheet);scrim.onclick=close;
  addEventListener('keydown',e=>{if(e.key==='Escape'&&cur)close()})};
 const label=s=>{const o=s.options[s.selectedIndex];return o?o.textContent:''};
 function close(){if(!cur)return;const b=cur.btn;sheet.classList.remove('on');scrim.classList.remove('on');b.setAttribute('aria-expanded','false');document.body.style.overflow='';cur=null;try{b.focus({preventScroll:true})}catch(e){}}
 function open(s,b){build();cur={s,btn:b};b.textContent='';
  const lb=s.id&&document.querySelector('label[for="'+s.id+'"]'),title=(lb&&lb.textContent.replace(/^\s*[•·]\s*/,'').trim())||'Pilih';
  const tc=getComputedStyle(b).getPropertyValue('--tc')||'#5de59b';sheet.style.setProperty('--tc',tc.trim()||'#5de59b');
  sheet.innerHTML='<div class="dh2"><i></i><b></b></div><div class="dl2"></div>';sheet.querySelector('b').textContent=title;
  const L=sheet.querySelector('.dl2');
  [...s.options].forEach((o,i)=>{const x=document.createElement('button');x.type='button';x.className='do';x.setAttribute('role','option');x.setAttribute('aria-selected',i===s.selectedIndex);x.innerHTML='<span></span><em>'+CK+'</em>';x.firstChild.textContent=o.textContent;x.firstChild.style.flex='1';x.firstChild.style.minWidth='0';
   x.onclick=()=>{s.selectedIndex=i;s.dispatchEvent(new Event('input',{bubbles:true}));s.dispatchEvent(new Event('change',{bubbles:true}));paint(s);close()};L.append(x)});
  b.innerHTML='';paint(s);b.setAttribute('aria-expanded','true');document.body.style.overflow='hidden';
  requestAnimationFrame(()=>{scrim.classList.add('on');sheet.classList.add('on');const a=L.querySelector('[aria-selected="true"]');if(a)a.scrollIntoView({block:'center'})})}
 function paint(s){const b=s._ddb;if(!b)return;b.innerHTML='<span></span>'+CH;b.firstChild.textContent=label(s)}
 function enhance(s){if(s._ddb||s.multiple||s.closest('.owp,.rrow,.dd'))return;
  const w=document.createElement('div');w.className='dd';s.parentNode.insertBefore(w,s);
  const b=document.createElement('button');b.type='button';b.className='ddb';b.setAttribute('aria-haspopup','listbox');b.setAttribute('aria-expanded','false');
  const lb=s.id&&document.querySelector('label[for="'+s.id+'"]');if(lb)b.setAttribute('aria-label',lb.textContent.trim()+': '+label(s));
  w.append(b,s);s.tabIndex=-1;s.setAttribute('aria-hidden','true');s._ddb=b;paint(s);
  b.onclick=()=>open(s,b);s.addEventListener('change',()=>paint(s));
  if(lb)lb.addEventListener('click',e=>{e.preventDefault();b.click()})}
 const scan=r=>(r||document).querySelectorAll('select').forEach(enhance);
 const start=()=>{scan();try{new MutationObserver(()=>scan()).observe(document.getElementById('c')?document.body:document.body,{childList:true,subtree:true})}catch(e){setInterval(scan,800)}};

<script>
/* v182e: dropdown kustom untuk semua <select> */
(function(){
 var sel=null,box=null,bd=null;
 function lab(s){var l=s.id&&document.querySelector('label[for="'+(window.CSS&&CSS.escape?CSS.escape(s.id):s.id)+'"]');
  if(!l){var p=s.parentElement;l=p&&p.querySelector('label')}
  var t=(l&&l.textContent||s.getAttribute('aria-label')||'Pilih').replace(/\s+/g,' ').trim();return t||'Pilih'}
 function close(){if(!box)return;var b=box,d=bd,s=sel;box=bd=sel=null;if(s)s.classList.remove('cs-open');b.classList.remove('on');d.classList.remove('on');setTimeout(function(){b.remove();d.remove()},260)}
 function open(s){
  if(box)close();sel=s;s.classList.add('cs-open');
  bd=document.createElement('div');bd.className='csb';
  box=document.createElement('div');box.className='css'+(s.closest('.owp')?' y':'');box.setAttribute('role','dialog');box.setAttribute('aria-label',lab(s));
  var h=document.createElement('div');h.className='hd';box.appendChild(h);
  var t=document.createElement('div');t.className='tt';t.textContent=lab(s);box.appendChild(t);
  var ls=document.createElement('div');ls.className='ls';ls.setAttribute('role','listbox');
  Array.prototype.forEach.call(s.options,function(o,i){
   if(o.hidden)return;
   var b=document.createElement('button');b.type='button';b.className='op';b.setAttribute('role','option');
   b.setAttribute('aria-selected',String(i===s.selectedIndex));
   var sp=document.createElement('span');sp.textContent=o.textContent;b.appendChild(sp);
   var ck=document.createElement('i');ck.className='ck';b.appendChild(ck);
   if(o.disabled)b.disabled=true;
   b.onclick=function(){var t=s;close();if(t.selectedIndex!==i){t.selectedIndex=i;t.dispatchEvent(new Event('input',{bubbles:true}));t.dispatchEvent(new Event('change',{bubbles:true}))}};
   ls.appendChild(b)});
  box.appendChild(ls);
  bd.onclick=close;
  document.body.appendChild(bd);document.body.appendChild(box);
  requestAnimationFrame(function(){bd.classList.add('on');box.classList.add('on');var a=ls.querySelector('[aria-selected=true]');if(a)ls.scrollTop=Math.max(0,a.offsetTop-ls.clientHeight/2+25)})}
 function hit(x,y){var all=document.querySelectorAll('select:not([multiple]):not([disabled])');
  for(var i=0;i<all.length;i++){var s=all[i];if(!s.getClientRects().length)continue;var r=s.getBoundingClientRect();
   if(x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom){var el=document.elementFromPoint(x,y);if(el&&(s===el||s.contains(el)||(s.parentElement&&s.parentElement.contains(el))))return s}}return null}
 document.addEventListener('click',function(e){if(e.target.closest&&e.target.closest('.css'))return;var s=hit(e.clientX,e.clientY);if(s){e.preventDefault();open(s)}},true);
 document.addEventListener('keydown',function(e){if(e.key==='Escape'&&box){close();return}
  var a=document.activeElement;if(a&&a.tagName==='SELECT'&&!a.multiple&&(e.key==='Enter'||e.key===' '||e.key==='ArrowDown')){e.preventDefault();open(a)}});
})();
</script>
